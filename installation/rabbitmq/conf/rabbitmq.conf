# =====================================================================
#  КЛАСТЕР
# =====================================================================

# Имя кластера в UI, метриках и federation/shovel.
cluster_name = prod-rmq

# Фиксированный список нод — самый предсказуемый способ обнаружения для статичных машин.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rmq1
cluster_formation.classic_config.nodes.2 = rabbit@rmq2
cluster_formation.classic_config.nodes.3 = rabbit@rmq3

# Нода при первом старте ждёт остальных, а не формирует кластер из одной себя.
cluster_formation.target_cluster_size_hint = 3

# Ключ cluster_partition_handling намеренно отсутствует: в 4.3 он игнорируется.
# Разделения обрабатывает Raft (Khepri, quorum queues, streams).

# После замены или пересоздания ноды quorum queues сами добавят на неё реплику до 3 штук.
quorum_queue.continuous_membership_reconciliation.enabled = true
# 3 реплики = число нод: очередь переживает потерю 1 ноды.
quorum_queue.continuous_membership_reconciliation.target_group_size = 3
# Не удалять реплики автоматически: удаление реплики — решение оператора.
quorum_queue.continuous_membership_reconciliation.auto_remove = false

# =====================================================================
#  ОЧЕРЕДИ
# =====================================================================

# Очередь без явного типа станет реплицированной quorum, а не classic на одной ноде.
default_queue_type = quorum

# Лидеры новых очередей распределяются по нодам равномерно.
# queue_master_locator в 4.3 запрещён, поэтому только этот ключ.
queue_leader_locator = balanced

# T_proc(15 мин) × 2 = 30 мин. Задан явно: в документации 4.3 умолчание описано противоречиво.
# По таймауту сообщения возвращаются в очередь, потребитель получает basic.cancel.
consumer_timeout = 1800000

# Через сколько (мс) вернуть в очередь сообщения потребителя, чья нода отрезана разделением.
# Больше короткого сетевого сбоя (иначе дубли), не настолько большое, чтобы сообщения зависали.
consumer_disconnected_timeout = 60000

# =====================================================================
#  ПАМЯТЬ
# =====================================================================

# L = 16 GiB (хост) − 2 GiB (ОС) = 14 GiB = 14 × 1073741824.
# Задаём явно: RabbitMQ в контейнере не всегда видит лимит cgroup.
total_memory_available_override_value = 15032385536

# W = L × 0.6 = 8.4 → 8 GiB = 8 × 1073741824. Абсолютное значение — рекомендация для контейнеров.
# Оставшиеся 6 GiB — запас на GC Erlang, WAL quorum queues и page cache.
vm_memory_high_watermark.absolute = 8589934592

# =====================================================================
#  ДИСК
# =====================================================================

# W(8) + WAL_max(0.5) + margin(1.5) = 10 GiB = 10 × 1073741824.
# Умолчание 50 MB для прода бесполезно: диск кончится раньше, чем сработает alarm.
disk_free_limit.absolute = 10737418240

# =====================================================================
#  СЕТЬ И СОЕДИНЕНИЯ
# =====================================================================

listeners.tcp.default = 5672

# Мёртвое соединение обнаруживается за 60–120 с. Timeout LB должен быть ≥ 3 × heartbeat.
heartbeat = 60

# C_total(6000) / (N−1)(2) × 1.5 = 4500. Рассчитано на ситуацию «одна нода упала».
# По памяти: 4500 × ~200 KiB ≈ 880 MiB ≈ 11% от W.
max_connections = 4500

# Каналов на одно соединение. Алиас старого имени — channel_max.
# Защита от утечек каналов в приложениях. Типично нужно 1–20.
max_channels_per_connection = 128

# Burst(1000) × 4 = 4096. На хосте net.core.somaxconn должен быть ≥ этого значения.
tcp_listen_options.backlog = 4096
# Без алгоритма Нейгла: меньше задержка на мелких AMQP-фреймах.
tcp_listen_options.nodelay = true
# TCP keepalive — второй уровень обнаружения мёртвых соединений (параметры в sysctl хоста).
tcp_listen_options.keepalive = true

# =====================================================================
#  БЕЗОПАСНОСТЬ
# =====================================================================

# guest может входить только с localhost.
# Образ *-management перебивает это файлом conf.d/10-defaults.conf, поэтому то же
# значение повторено в conf/99-override.conf: conf.d грузится после rabbitmq.conf.
loopback_users.guest = true

# Применяется ТОЛЬКО при первом старте на пустом data/. Позже меняйте через rabbitmqctl или definitions.
# Значение можно зашифровать (encrypted:...), такие теги поддерживает больше ключей с 4.3.
default_user = admin
default_pass = CHANGE_ME_STRONG
default_user_tags.administrator = true
default_vhost = /

# =====================================================================
#  MANAGEMENT / PROMETHEUS
# =====================================================================

management.tcp.port = 15672
# Лимит HTTP-соединений к API/UI (4.3.1+): администраторы + скрипты автоматизации с запасом.
management.tcp.max_connections = 50
# 4.3.5+: UI хранит в браузере зашифрованный токен вместо логина и пароля.
# Одинаковый на всех нодах, иначе за балансировщиком будут «вылетать» сессии.
management.credential_encryption_secret = CHANGE_ME_SAME_ON_ALL_NODES

prometheus.tcp.port = 15692
# Число scrape-серверов (например, 2 Prometheus в HA) × 2 + запас.
prometheus.tcp.max_connections = 10

# =====================================================================
#  ЛОГИ
# =====================================================================

# Логи в stdout, ротацию делает Docker (json-file max-size/max-file).
log.console = true
log.console.level = info
log.file = false
